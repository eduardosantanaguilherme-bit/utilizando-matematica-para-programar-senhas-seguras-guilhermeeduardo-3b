<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="conteudo">
        <section class="conteudo-titulo">
            <div class="icone-cadeado" aria-hidden="true">
                <svg viewBox="0 0 48 48" role="img">
                    <path d="M14 21v-7a10 10 0 0 1 20 0v7" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                    <rect x="9" y="20" width="30" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="4"/>
                    <circle cx="24" cy="31" r="3" fill="currentColor"/>
                    <path d="M24 33v5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="titulo-principal">Gerador de senhas</h1>
            <p class="titulo-secundario">Gere instantaneamente uma senha aleatória e segura.</p>
        </section>

        <section class="conteudo-senha" aria-label="Senha gerada">
            <label for="campo-senha">Sua senha</label>
            <div class="campo-senha-wrap">
                <input name="senha" type="text" id="campo-senha" readonly autocomplete="off" spellcheck="false" aria-live="polite">
                <button id="copiar-senha" type="button" class="botao-copiar" title="Copiar senha" aria-label="Copiar senha">Copiar</button>
            </div>
            <p id="mensagem-copia" class="mensagem-copia" aria-live="polite"></p>
        </section>

        <section class="parametro">
            <h2 class="parametro-titulo">Personalize sua senha</h2>
            <div class="parametro-coluna__senha">
                <div class="parametro-senha parametro-tamanho">
                    <h3 class="parametro-senha__titulo">Número de caracteres</h3>
                    <div class="parametro-senha-botoes">
                        <button class="parametro-senha__botao" type="button" aria-label="Diminuir tamanho">−</button>
                        <p class="parametro-senha__texto" aria-live="polite">12</p>
                        <button class="parametro-senha__botao" type="button" aria-label="Aumentar tamanho">+</button>
                    </div>
                    <p class="ajuda">Escolha entre 1 e 20 caracteres.</p>
                </div>

                <div class="parametro-senha parametro-caracteristicas">
                    <h3 class="parametro-senha__titulo">Características da senha</h3>
                    <div class="parametro-senha-checkbox">
                        <input name="maiusculo" type="checkbox" class="checkbox" id="maiusculo" checked>
                        <label for="maiusculo">Letras maiúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="minusculo" type="checkbox" class="checkbox" id="minusculo">
                        <label for="minusculo">Letras minúsculas</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="numero" type="checkbox" class="checkbox" id="numero">
                        <label for="numero">Números</label>
                    </div>
                    <div class="parametro-senha-checkbox">
                        <input name="simbolo" type="checkbox" class="checkbox" id="simbolo">
                        <label for="simbolo">Símbolos</label>
                    </div>
                    <p class="ajuda" id="aviso-opcoes" aria-live="polite"></p>
                </div>

                <div class="parametro-senha parametro-forca">
                    <h3 class="parametro-senha__titulo">Força da senha</h3>
                    <div class="barra" aria-hidden="true"></div>
                    <div class="forca fraca" id="barra-forca" aria-hidden="true"></div>
                    <div class="parametro-senha-textos">
                        <p>Fraca</p><p>Média</p><p>Forte</p>
                    </div>
                    <p class="entropia" id="estimativa"></p>
                </div>
            </div>
        </section>
        <footer>Uma senha única e forte ajuda a proteger suas contas.</footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
